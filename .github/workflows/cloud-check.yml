name: Cloud implementation check
on:
  push:
    branches: [codex/atlas-cloud-2026-10-13]
permissions:
  contents: read
concurrency:
  group: atlas-cloud-check
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Source checkpoint
        run: git archive --format=tar HEAD | gzip > /tmp/atlas-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-source
          path: /tmp/atlas-source.tar.gz
          retention-days: 1
      - run: npm ci
      - run: npm run check
      - run: npm run build
