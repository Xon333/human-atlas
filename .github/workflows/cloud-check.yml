name: Cloud implementation check
on:
  push:
    branches: [codex/atlas-cloud-2026-10-13]
permissions:
  contents: write
concurrency:
  group: atlas-cloud-check
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply reviewed portable source patch
        run: |
          if test -f scripts/cloud-implementation.patch; then
            test "$GITHUB_REF_NAME" = codex/atlas-cloud-2026-10-13
            git apply --check scripts/cloud-implementation.patch
            git apply scripts/cloud-implementation.patch
          fi
      - run: npm ci
      - run: |
          npm run check
          npm run test:search
          npm run test:course
          npm run test:runtime
          npm run test:geometry
          npm run test:scene
          npm run test:loading
          npm run test:regions
          npm run build
      - name: Publish verified source on isolated branch only
        run: |
          if test -f scripts/cloud-implementation.patch; then
            test "$GITHUB_REF_NAME" = codex/atlas-cloud-2026-10-13
            git diff --check
            git rm scripts/cloud-implementation.patch
            git add app/course.ts scripts/private-runtime.test.mjs server/private-runtime.mjs
            git -c user.name='Atlas cloud implementation' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: serve registered exported PDFs without exposing source directories'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
