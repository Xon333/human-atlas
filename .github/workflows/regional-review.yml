name: Atlas integration validation
on:
  push:
    branches: [main]
    paths: ['app/**', 'components/**', 'hooks/**', 'lib/**', 'scripts/**', 'server/**', 'web/**', 'public/**', 'package*.json', 'tsconfig.json', 'vite.config.ts', 'vercel.json', '.github/workflows/regional-review.yml']
  pull_request:
    paths: ['app/**', 'components/**', 'hooks/**', 'lib/**', 'scripts/**', 'server/**', 'web/**', 'public/**', 'package*.json', 'tsconfig.json', 'vite.config.ts', 'vercel.json', '.github/workflows/regional-review.yml']
permissions:
  contents: read
concurrency:
  group: atlas-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: |
          npm run check
          npm run test:course
          npm run test:runtime
          npm run test:geometry
          npm run test:scene
          node --experimental-strip-types --test scripts/scene-scope.test.mjs
          node scripts/validate-atlas.mjs
          node scripts/validate-interactions.mjs
          npm run build
