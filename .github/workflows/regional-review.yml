name: Regional review validation
on:
  push:
    branches: [codex/uni-regional-review-2026-10-10]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check && npm run test:course && npm run test:runtime && npm run build
      - name: Package isolated test inputs
        run: |
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/atlas-source.tar.gz"
          tar -czf "$RUNNER_TEMP/atlas-dependencies.tar.gz" node_modules
          sha256sum "$RUNNER_TEMP/atlas-source.tar.gz" "$RUNNER_TEMP/atlas-dependencies.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: regional-review-inputs
          retention-days: 1
          path: |
            ${{ runner.temp }}/atlas-source.tar.gz
            ${{ runner.temp }}/atlas-dependencies.tar.gz
