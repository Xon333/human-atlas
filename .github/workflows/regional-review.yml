name: Atlas integration validation
on:
  push:
    branches: [codex/uni-regional-review-2026-10-10, codex/uni-study-mode-2026-10-10, codex/system-memory-audit-2026-10-10, t3/region-first-human-atlas]
    paths: ['app/**', 'scripts/**', 'server/**', 'web/**', 'public/models/**', 'package*.json', '.github/workflows/regional-review.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # Exact-byte regional proof reads accepted PR #1 source 5224668.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: |
          npm run check
          npm run test:course
          npm run test:runtime
          npm run test:geometry
          npm run test:scene
          npm run test:regions
          npm run test:loading
          node scripts/validate-atlas.mjs
          node scripts/validate-interactions.mjs
          npm run build
