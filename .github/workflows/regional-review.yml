name: Regional review validation
on:
  push:
    branches: [codex/uni-regional-review-2026-10-10]
    paths: ['app/**', 'scripts/**', 'server/**', 'web/**', 'package*.json', '.github/workflows/regional-review.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check && npm run test:course && npm run test:runtime && npm run build
      - name: Archive this public source revision for independent review
        if: always()
        run: git archive --format=tar --prefix=atlas/ HEAD > /tmp/atlas-review-source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regional-review-source
          path: /tmp/atlas-review-source.tar
          retention-days: 1
          if-no-files-found: error
